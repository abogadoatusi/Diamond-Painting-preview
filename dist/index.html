<title>ダイヤモンドアート図案メーカー</title>
<style>
/* ビーズの色を正しく見比べられるよう、UI は明るい面に固定する。
   ネイティブ部品（チェックボックス・スライダー・色ピッカー）も明るい側に揃える。 */
:root{
  color-scheme:light;
  --bg:#f5f6f8; --panel:#ffffff; --line:#dfe3e8; --ink:#1d2329; --muted:#6b7580;
  --accent:#2f6fed; --accent-ink:#ffffff; --shadow:0 1px 2px rgba(20,30,45,.08),0 6px 18px rgba(20,30,45,.06);
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0; background:var(--bg); color:var(--ink);
  font:14px/1.6 -apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP","Yu Gothic UI",sans-serif;
}
h1{font-size:16px;margin:0;font-weight:700;letter-spacing:.02em;white-space:nowrap}

/* ---- top bar ---- */
.topbar{
  display:flex;align-items:center;gap:16px;padding:10px 16px;background:var(--panel);
  border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20;
}
.topbar-info{flex:1;color:var(--muted);font-size:12.5px;font-variant-numeric:tabular-nums;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.topbar-actions{display:flex;gap:8px}

/* ---- layout ---- */
.layout{
  display:grid;grid-template-columns:320px minmax(0,1fr) 300px;gap:12px;
  padding:12px;align-items:start;height:calc(100vh - 53px);
}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);overflow:hidden}
.controls,.palette{height:100%;overflow-y:auto}
.preview{height:100%;display:flex;flex-direction:column;min-width:0}
@media (max-width:1180px){
  .layout{grid-template-columns:1fr;height:auto}
  .controls,.palette,.preview{height:auto}
  .canvas-wrap{min-height:52vh}
}

/* ---- controls ---- */
details{border-bottom:1px solid var(--line)}
details:last-child{border-bottom:0}
summary{padding:11px 14px;font-weight:700;cursor:pointer;user-select:none;font-size:13.5px;background:#fafbfc}
summary::marker{color:var(--muted)}
.body{padding:8px 14px 16px;display:flex;flex-direction:column;gap:9px}
label{font-size:12.5px;color:#39424c}
.row{display:flex;align-items:center;gap:8px;justify-content:space-between}
.row>select,.row>input[type=number],.row>input[type=text]{flex:1;min-width:0}
.row>input[type=range]{flex:1;min-width:60px}
.row>output{width:44px;text-align:right;font-variant-numeric:tabular-nums;color:var(--muted)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.grid2 label{display:flex;flex-direction:column;gap:3px}
.check{display:flex;align-items:center;gap:7px;cursor:pointer}
.inline{white-space:nowrap}
input[type=text],input[type=number],select{
  padding:6px 8px;border:1px solid var(--line);border-radius:6px;background:#fff;color:var(--ink);font:inherit;font-size:13px;
}
input[type=color]{width:38px;height:28px;padding:1px;border:1px solid var(--line);border-radius:6px;background:#fff}
input:focus,select:focus,button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.hint{color:var(--muted);font-size:11.5px;margin:2px 0 0}
.hint.pad{padding:0 12px}
.calc{margin:4px 0 0;padding:8px 10px;background:#f0f4fd;border:1px solid #d9e3fb;border-radius:7px;font-size:12px;line-height:1.7;white-space:pre-line;font-variant-numeric:tabular-nums}

/* ---- buttons ---- */
button{font:inherit;font-size:13px;border-radius:7px;border:1px solid var(--line);background:#fff;color:var(--ink);padding:6px 12px;cursor:pointer}
button:hover{background:#f1f3f6}
button.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
button.primary:hover{filter:brightness(1.07)}
button.wide{width:100%;padding:9px}
button.sm{padding:4px 8px;font-size:12px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:7px;overflow:hidden}
.seg button{border:0;border-radius:0;padding:5px 10px;font-size:12px}
.seg button+button{border-left:1px solid var(--line)}
.seg button.on{background:var(--accent);color:#fff;font-weight:600}

/* ---- drop zone ---- */
.drop{border:2px dashed var(--line);border-radius:9px;padding:14px;text-align:center;transition:.15s}
.drop.over{border-color:var(--accent);background:#eef3fe}
.drop img{max-width:100%;max-height:150px;margin-top:10px;border-radius:6px;display:block;margin-inline:auto}

/* ---- preview ---- */
.toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;padding:9px 12px;border-bottom:1px solid var(--line);background:#fafbfc}
.canvas-wrap{flex:1;overflow:auto;background:
  linear-gradient(45deg,#eceef1 25%,transparent 25%,transparent 75%,#eceef1 75%),
  linear-gradient(45deg,#eceef1 25%,#f7f8fa 25%,#f7f8fa 75%,#eceef1 75%);
  background-size:16px 16px;background-position:0 0,8px 8px;display:flex;align-items:flex-start;justify-content:center;padding:16px;min-height:300px}
#canvas{image-rendering:pixelated;box-shadow:0 2px 14px rgba(0,0,0,.18);background:#fff;cursor:crosshair}
.placeholder{color:var(--muted);align-self:center}
.statusbar{padding:7px 12px;border-top:1px solid var(--line);color:var(--muted);font-size:12px;background:#fafbfc;min-height:31px;font-variant-numeric:tabular-nums}

/* ---- palette ---- */
.palette-head{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 12px;border-bottom:1px solid var(--line);background:#fafbfc;flex-wrap:wrap}
.palette-head>div{display:flex;gap:5px}
.palette-list{padding:8px}
.prow{display:grid;grid-template-columns:26px 22px 1fr auto;gap:7px;align-items:center;padding:5px 6px;border-radius:7px;border:1px solid transparent;cursor:pointer}
.prow:hover{background:#f3f5f8}
.prow.sel{border-color:var(--accent);background:#eef3fe}
.sw{width:26px;height:26px;border-radius:5px;border:1px solid rgba(0,0,0,.18);cursor:pointer}
.sym{font:700 13px/1 ui-monospace,Menlo,Consolas,monospace;text-align:center;color:#39424c}
.pmeta{min-width:0}
.pcode{width:100%;padding:3px 5px;font-size:12.5px;border:1px solid transparent;background:transparent;border-radius:4px}
.pcode:hover,.pcode:focus{border-color:var(--line);background:#fff}
.pname{font-size:10.5px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding-left:5px}
.pcount{font-size:11.5px;color:var(--muted);text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.pdel{border:0;background:transparent;color:var(--muted);padding:2px 4px;font-size:13px;line-height:1}
.pdel:hover{color:#c0392b;background:transparent}

/* ---- modal ---- */
[hidden]{display:none !important}
.modal{position:fixed;inset:0;background:rgba(16,22,30,.45);display:flex;align-items:center;justify-content:center;z-index:50;padding:16px}
.modal-card{background:#fff;border-radius:12px;width:min(560px,100%);max-height:86vh;display:flex;flex-direction:column;box-shadow:0 20px 60px rgba(0,0,0,.3)}
.modal-head,.modal-foot{padding:12px 16px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between}
.modal-foot{border-bottom:0;border-top:1px solid var(--line);justify-content:flex-end}
.modal-body{padding:14px 16px;overflow:auto;display:flex;flex-direction:column;gap:10px}
.dmc-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:5px;max-height:320px;overflow:auto;border:1px solid var(--line);border-radius:8px;padding:7px}
.dmc-item{display:flex;align-items:center;gap:6px;padding:4px 5px;border-radius:5px;cursor:pointer;font-size:11.5px;border:1px solid transparent}
.dmc-item:hover{background:#f1f3f6}
.dmc-item.on{border-color:var(--accent);background:#eef3fe}
.dmc-item i{width:16px;height:16px;border-radius:4px;border:1px solid rgba(0,0,0,.18);flex:none}
.dmc-item span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* ================= タブ（狭い画面用） ================= */
.tabbar{display:none;gap:6px;padding:8px 12px 0;background:var(--bg);position:sticky;top:53px;z-index:15}
.tabbar button{flex:1;padding:9px 6px;font-size:13px;font-weight:600;border-radius:9px 9px 0 0;border-bottom:0;color:var(--muted);background:#eceff3}
.tabbar button.on{background:var(--panel);color:var(--accent);box-shadow:0 -1px 2px rgba(20,30,45,.06)}
h1 .t-short{display:none}

/* ================= レスポンシブ ================= */
@media (max-width:1180px){
  .tabbar{display:flex}
  .layout{padding-top:0;gap:0}
  .layout>.panel{display:none;border-radius:0 0 10px 10px}
  .layout>.panel.active{display:block}
  .layout>.panel.preview.active{display:flex}
  .canvas-wrap{min-height:46vh}
  .toolbar{position:sticky;top:0;z-index:5}
}
@media (max-width:760px){
  .topbar{flex-wrap:wrap;gap:6px 10px;padding:8px 12px}
  h1{font-size:15px}
  h1 .t-full{display:none}
  h1 .t-short{display:inline}
  .topbar-info{order:3;flex:1 0 100%;font-size:11px;white-space:normal}
  .topbar-actions{margin-left:auto;gap:6px}
  .topbar-actions button{padding:7px 10px;font-size:12.5px}
  .tabbar{top:0;position:static}
  .body{padding:8px 12px 14px}
  .palette-head,.palette-list{padding-inline:10px}
  .canvas-wrap{padding:10px}
  .toolbar{gap:8px;padding:8px 10px}
  .toolbar .row.inline{flex:1 0 100%}
}
@media (hover:none){
  .drop .hint{display:none}
}
/* 指で塗るモードのときだけ、キャンバス上のスクロールを止める */
#canvas.touch-paint{touch-action:none}
.touch-only{display:none}
body.is-touch .touch-only{display:flex}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{transition-duration:.01ms !important;animation-duration:.01ms !important}
}

</style>
<header class="topbar">
  <h1><span class="t-full">ダイヤモンドアート図案メーカー</span><span class="t-short">図案メーカー</span></h1>
  <div class="topbar-info" id="dimInfo">画像を読み込んでください</div>
  <div class="topbar-actions">
    <button id="btnSave" class="ghost" type="button">保存</button>
    <button id="btnLoad" class="ghost" type="button">読込</button>
    <button id="btnPng" class="ghost" type="button">PNG</button>
    <button id="btnPdf" class="primary" type="button">PDFを書き出す</button>
  </div>
</header>

<nav class="tabbar" id="tabbar">
  <button type="button" data-p="controls" class="on">① 設定</button>
  <button type="button" data-p="preview">② プレビュー</button>
  <button type="button" data-p="palette">③ 色</button>
</nav>

<main class="layout">

  <!-- ============ 左：設定 ============ -->
  <section class="panel controls active" data-panel="controls">

    <details open>
      <summary>1. 画像</summary>
      <div class="body">
        <div id="drop" class="drop">
          <input type="file" id="file" accept="image/*" hidden>
          <button type="button" class="primary wide" id="btnPick">画像を選ぶ</button>
          <p class="hint">ここにドラッグ＆ドロップでもOK</p>
          <img id="thumb" alt="" hidden>
        </div>
        <label class="row">トリミング
          <select id="fit">
            <option value="cover">全面（はみ出しをカット）</option>
            <option value="contain">全体を収める（余白あり）</option>
          </select>
        </label>
        <label class="row">ズーム <input type="range" id="zoom" min="100" max="300" value="100"><output id="zoomOut">1.00×</output></label>
        <label class="row">左右位置 <input type="range" id="offX" min="-50" max="50" value="0"><output id="offXOut">0</output></label>
        <label class="row">上下位置 <input type="range" id="offY" min="-50" max="50" value="0"><output id="offYOut">0</output></label>
        <label class="row">余白の色 <input type="color" id="bg" value="#ffffff"></label>
      </div>
    </details>

    <details open>
      <summary>2. 仕上がりサイズ（mm）</summary>
      <div class="body">
        <label class="row">用紙プリセット
          <select id="preset">
            <option value="100x148">ハガキ 縦 100 × 148</option>
            <option value="148x100">ハガキ 横 148 × 100</option>
            <option value="105x148">A6 縦 105 × 148</option>
            <option value="148x210">A5 縦 148 × 210</option>
            <option value="210x297">A4 縦 210 × 297</option>
            <option value="100x100">正方形 100 × 100</option>
            <option value="custom">カスタム</option>
          </select>
        </label>
        <div class="grid2">
          <label>幅 mm <input type="number" id="paperW" value="100" min="20" max="600" step="1"></label>
          <label>高さ mm <input type="number" id="paperH" value="148" min="20" max="600" step="1"></label>
        </div>
        <label class="row">余白 mm <input type="number" id="margin" value="4" min="0" max="40" step="0.5"></label>
        <label class="row">ビーズ形状
          <select id="shape">
            <option value="square">角ビーズ（隙間なし）</option>
            <option value="round">丸ビーズ（隙間あり）</option>
          </select>
        </label>
        <label class="row">ビーズ間隔 mm
          <select id="beadPreset">
            <option value="2.5">2.5（角ビーズ標準）</option>
            <option value="2.8">2.8（丸ビーズ標準）</option>
            <option value="2.6">2.6</option>
            <option value="3">3.0（大きめ・初心者向き）</option>
            <option value="custom">カスタム</option>
          </select>
        </label>
        <label class="row" id="beadCustomRow" hidden>間隔 mm <input type="number" id="bead" value="2.5" min="1" max="10" step="0.1"></label>
        <p class="calc" id="calcInfo"></p>
      </div>
    </details>

    <details open>
      <summary>3. 色と画質</summary>
      <div class="body">
        <label class="row">色数 <input type="number" id="colors" value="20" min="2" max="60" step="1"></label>
        <label class="row">使う色
          <select id="stock">
            <option value="dmc">DMC相当プリセット全色から選ぶ</option>
            <option value="lock">今のパレットに固定して再変換</option>
          </select>
        </label>
        <label class="check"><input type="checkbox" id="dither"> 誤差拡散（写真向き・粒々になります）</label>
        <label class="check"><input type="checkbox" id="despeckle" checked> 孤立した1粒を消す（貼りやすくする）</label>
        <label class="row">明るさ <input type="range" id="brightness" min="-60" max="60" value="0"><output id="brightnessOut">0</output></label>
        <label class="row">コントラスト <input type="range" id="contrast" min="-60" max="60" value="0"><output id="contrastOut">0</output></label>
        <label class="row">彩度 <input type="range" id="saturation" min="0" max="200" value="110"><output id="saturationOut">110</output></label>
        <label class="row">ガンマ <input type="range" id="gamma" min="50" max="160" value="100"><output id="gammaOut">100</output></label>
        <button type="button" class="primary wide" id="btnGenerate">図案を作る / 作り直す</button>
      </div>
    </details>

    <details open>
      <summary>4. PDF出力の設定</summary>
      <div class="body">
        <label class="row">作品名 <input type="text" id="title" placeholder="無題のダイヤモンドアート"></label>
        <label class="check"><input type="checkbox" id="pdfActual" checked> 実寸チャート（用紙サイズちょうど・下地用）</label>
        <label class="check"><input type="checkbox" id="pdfActualFill" checked> 　└ セルを薄い色で塗る</label>
        <label class="check"><input type="checkbox" id="pdfActualSym" checked> 　└ 記号を印刷する</label>
        <label class="check"><input type="checkbox" id="pdfBig" checked> 拡大チャート（A4・見ながら貼る用）</label>
        <label class="row">　└ 1マス mm <input type="number" id="bigCell" value="6" min="3" max="12" step="0.5"></label>
        <label class="check"><input type="checkbox" id="pdfLegend" checked> 色一覧（DMC番号・粒数・必要袋数）</label>
        <label class="row">1袋の粒数 <input type="number" id="perBag" value="200" min="10" max="2000" step="10"></label>
        <p class="hint">実寸チャートはフチなし印刷（等倍・100%）で出力してください。</p>
      </div>
    </details>

  </section>

  <!-- ============ 中：プレビュー ============ -->
  <section class="panel preview" data-panel="preview">
    <div class="toolbar">
      <div class="seg" id="viewMode">
        <button type="button" data-v="color" class="on">カラー</button>
        <button type="button" data-v="both">カラー+記号</button>
        <button type="button" data-v="symbol">記号のみ</button>
      </div>
      <label class="check inline"><input type="checkbox" id="showGrid" checked> グリッド</label>
      <label class="row inline">表示倍率 <input type="range" id="viewZoom" min="3" max="28" value="10"></label>
      <button type="button" class="ghost" id="btnFit">全体表示</button>
      <div class="seg" id="tool">
        <button type="button" data-t="paint" class="on">塗る</button>
        <button type="button" data-t="pick">スポイト</button>
      </div>
      <label class="check inline touch-only"><input type="checkbox" id="touchPaint"> 指でなぞって塗る</label>
      <button type="button" class="ghost" id="btnUndo">元に戻す</button>
    </div>
    <div class="canvas-wrap" id="canvasWrap">
      <canvas id="canvas"></canvas>
      <p class="placeholder" id="placeholder">画像を選んで「図案を作る」を押してください</p>
    </div>
    <div class="statusbar" id="status"></div>
  </section>

  <!-- ============ 右：パレット ============ -->
  <section class="panel palette" data-panel="palette">
    <div class="palette-head">
      <strong>カラーパレット</strong>
      <div>
        <button type="button" class="ghost sm" id="btnAdd">色を追加</button>
        <button type="button" class="ghost sm" id="btnCsvIn">CSV読込</button>
        <button type="button" class="ghost sm" id="btnCsvOut">CSV出力</button>
        <input type="file" id="csvFile" accept=".csv,text/csv" hidden>
      </div>
    </div>
    <p class="hint pad">行をクリックで選択（プレビューを塗る色になります）。番号や色は直接書き換えられます。</p>
    <div class="palette-list" id="paletteList"></div>
  </section>

</main>

<!-- 色を選ぶダイアログ -->
<div class="modal" id="modal" hidden>
  <div class="modal-card">
    <div class="modal-head">
      <strong id="modalTitle">色を選ぶ</strong>
      <button type="button" class="ghost sm" id="modalClose">閉じる</button>
    </div>
    <div class="modal-body">
      <div class="grid2">
        <label>カラーコード <input type="text" id="mCode" placeholder="例: 310 / DMC 310 / 自社1番"></label>
        <label>色 <input type="color" id="mHex" value="#000000"></label>
      </div>
      <label class="row">HEX <input type="text" id="mHexText" placeholder="#RRGGBB"></label>
      <label class="row">プリセット検索 <input type="text" id="mSearch" placeholder="番号や色名（例: 310, Rose）"></label>
      <div class="dmc-list" id="dmcList"></div>
    </div>
    <div class="modal-foot">
      <button type="button" class="primary" id="mApply">この色にする</button>
    </div>
  </div>
</div>

<input type="file" id="projFile" accept="application/json,.json" hidden>
<script>
/* DMC 相当色のプリセットパレット。
 * hex はメーカー公表値ではなく、一般に流通している DMC→RGB 換算表を基にした「近似値」です。
 * 実際のビーズの色味は製造ロットや業者で異なるため、アプリ上でいつでも編集・追加できます。 */
var DMC_COLORS = [
  {code:'B5200', name:'Snow White',            hex:'#FFFFFF'},
  {code:'BLANC', name:'White',                 hex:'#FCFCFC'},
  {code:'3865',  name:'Winter White',          hex:'#F9F7F1'},
  {code:'ECRU',  name:'Ecru',                  hex:'#F0EAD6'},
  {code:'822',   name:'Beige Gray LT',         hex:'#E5DFD0'},
  {code:'644',   name:'Beige Gray MD',         hex:'#DDD7C6'},
  {code:'642',   name:'Beige Gray DK',         hex:'#A8A08C'},
  {code:'640',   name:'Beige Gray VDK',        hex:'#8B8371'},
  {code:'3024',  name:'Brown Gray VLT',        hex:'#DAD7CE'},
  {code:'3023',  name:'Brown Gray LT',         hex:'#B5AB98'},
  {code:'3022',  name:'Brown Gray MD',         hex:'#9B9B84'},
  {code:'3021',  name:'Brown Gray VDK',        hex:'#5A5348'},
  {code:'453',   name:'Shell Gray LT',         hex:'#D6C9C1'},
  {code:'452',   name:'Shell Gray MD',         hex:'#C0AEA6'},
  {code:'451',   name:'Shell Gray DK',         hex:'#A08C86'},
  {code:'762',   name:'Pearl Gray VLT',        hex:'#ECECEC'},
  {code:'415',   name:'Pearl Gray',            hex:'#D3D3D8'},
  {code:'318',   name:'Steel Gray LT',         hex:'#B5B5B5'},
  {code:'414',   name:'Steel Gray DK',         hex:'#8C8C8C'},
  {code:'317',   name:'Pewter Gray',           hex:'#6C6C6C'},
  {code:'413',   name:'Pewter Gray DK',        hex:'#565656'},
  {code:'3799',  name:'Pewter Gray VDK',       hex:'#292C2F'},
  {code:'310',   name:'Black',                 hex:'#000000'},
  {code:'648',   name:'Beaver Gray LT',        hex:'#C8C8BE'},
  {code:'647',   name:'Beaver Gray MD',        hex:'#B0B0A5'},

    s += p.join(' ') + ' ' + (fill && stroke ? 'B' : fill ? 'f' : 'S');
    this.ops.push(s);
    return this;
  };

  /* y はベースライン位置(mm)。align: left|center|right */
  Page.prototype.text = function (str, x, y, size, opt) {
    opt = opt || {};
    var bold = !!opt.bold;
    var w = textWidth(str, size, bold);
    var tx = x;
    if (opt.align === 'center') tx = x - w / 2;
    else if (opt.align === 'right') tx = x - w;
    this.ops.push('BT ' + rgbOf(opt.color || '#000') + ' rg /' + (bold ? 'F2' : 'F1') + ' ' +
      num(size) + ' Tf ' + num(tx * MM) + ' ' + this.Y(y) + ' Td (' + esc(str) + ') Tj ET');
    return this;
  };

  /* 中央そろえで「セル内」に収める記号描画 */
  Page.prototype.glyph = function (ch, cx, cy, size, color) {
    this.text(ch, cx, cy + size * 0.36 / MM, size, { align: 'center', color: color });
    return this;
  };

  /* JPEG の dataURL を貼る */
  Page.prototype.image = function (dataUrl, x, y, w, h) {
    var id = this.doc._addImage(dataUrl);
    this.images.push(id);
    this.ops.push('q ' + num(w * MM) + ' 0 0 ' + num(h * MM) + ' ' +
      this.X(x) + ' ' + this.Y(y + h) + ' cm /Im' + id + ' Do Q');
    return this;
  };

  function Doc() { this.pages = []; this.imgs = []; }

  Doc.prototype.addPage = function (wmm, hmm) {
    var p = new Page(this, wmm, hmm);
    this.pages.push(p);
    return p;
  };

  Doc.prototype._addImage = function (dataUrl) {
    for (var i = 0; i < this.imgs.length; i++) if (this.imgs[i].url === dataUrl) return i;
    var comma = dataUrl.indexOf(',');
    var bin = atob(dataUrl.slice(comma + 1));
    var dim = jpegSize(bin);
    this.imgs.push({ url: dataUrl, bin: bin, w: dim[0], h: dim[1] });
    return this.imgs.length - 1;
  };

  function jpegSize(bin) {
    var i = 2;
    while (i < bin.length) {
      if (bin.charCodeAt(i) !== 0xFF) { i++; continue; }
      var marker = bin.charCodeAt(i + 1);
      var len = (bin.charCodeAt(i + 2) << 8) | bin.charCodeAt(i + 3);
      if (marker >= 0xC0 && marker <= 0xCF && marker !== 0xC4 && marker !== 0xC8 && marker !== 0xCC) {
        return [(bin.charCodeAt(i + 7) << 8) | bin.charCodeAt(i + 8),
                (bin.charCodeAt(i + 5) << 8) | bin.charCodeAt(i + 6)];
      }
      i += 2 + len;
    }
    return [1, 1];
  }

  Doc.prototype.build = function () {
    var objs = [];                      // 1-origin
    function put(body) { objs.push(body); return objs.length; }

    var catalogId = put('');            // 1
    var pagesId = put('');              // 2
    var f1 = put('<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica /Encoding /WinAnsiEncoding >>');
    var f2 = put('<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica-Bold /Encoding /WinAnsiEncoding >>');

    var imgIds = this.imgs.map(function (im) {
      return put('<< /Type /XObject /Subtype /Image /Width ' + im.w + ' /Height ' + im.h +
        ' /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length ' +
        im.bin.length + ' >>\nstream\n' + im.bin + '\nendstream');
    });

    var kids = [];
    this.pages.forEach(function (p) {
      var content = p.ops.join('\n');
      var cid = put('<< /Length ' + content.length + ' >>\nstream\n' + content + '\nendstream');
      var xo = p.images.length
        ? ' /XObject << ' + p.images.map(function (i) { return '/Im' + i + ' ' + imgIds[i] + ' 0 R'; }).join(' ') + ' >>'
        : '';
      var pid = put('<< /Type /Page /Parent ' + pagesId + ' 0 R /MediaBox [0 0 ' +
        num(p.w * MM) + ' ' + num(p.h * MM) + '] /Resources << /Font << /F1 ' + f1 +
        ' 0 R /F2 ' + f2 + ' 0 R >>' + xo + ' >> /Contents ' + cid + ' 0 R >>');
      kids.push(pid);
    });

    objs[catalogId - 1] = '<< /Type /Catalog /Pages ' + pagesId + ' 0 R >>';
    objs[pagesId - 1] = '<< /Type /Pages /Count ' + kids.length + ' /Kids [' +
      kids.map(function (k) { return k + ' 0 R'; }).join(' ') + '] >>';

    var out = '%PDF-1.4\n%\xE2\xE3\xCF\xD3\n';
    var offsets = [];
    objs.forEach(function (body, i) {
      offsets.push(out.length);
      out += (i + 1) + ' 0 obj\n' + body + '\nendobj\n';
    });
    var xref = out.length;
    out += 'xref\n0 ' + (objs.length + 1) + '\n0000000000 65535 f \n';
    offsets.forEach(function (o) {
      out += ('0000000000' + o).slice(-10) + ' 00000 n \n';
    });
    out += 'trailer\n<< /Size ' + (objs.length + 1) + ' /Root ' + catalogId + ' 0 R >>\n' +
           'startxref\n' + xref + '\n%%EOF\n';

    var bytes = new Uint8Array(out.length);
    for (var i = 0; i < out.length; i++) bytes[i] = out.charCodeAt(i) & 0xFF;
    return new Blob([bytes], { type: 'application/pdf' });
  };

  Doc.prototype.save = function (filename) {
    var url = URL.createObjectURL(this.build());
    var a = document.createElement('a');
    a.href = url; a.download = filename;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(function () { URL.revokeObjectURL(url); }, 4000);
  };

  return { Doc: Doc, textWidth: textWidth, MM: MM };
})();

/* ダイヤモンドアート図案メーカー — UI とアプリ本体 */
(function () {
  'use strict';

  var $ = function (id) { return document.getElementById(id); };

  var STORE_KEY = 'diamond-art-maker-v1';

  var S = {
    img: null, srcUrl: null,

    sel: 0, edited: false, undo: [], cellPx: 10, everGenerated: false,
    editingIndex: -1

  /* ================= 寸法計算 ================= */

  function beadSize() {
    var p = $('beadPreset').value;
    return p === 'custom' ? Math.max(0.5, +$('bead').value || 2.5) : +p;
  }

  function dims() {
    var pw = Math.max(20, +$('paperW').value || 100);
    var ph = Math.max(20, +$('paperH').value || 148);
    var m = Math.max(0, +$('margin').value || 0);
    var b = beadSize();
    var cols = Math.max(1, Math.floor((pw - 2 * m) / b + 1e-9));
    var rows = Math.max(1, Math.floor((ph - 2 * m) / b + 1e-9));
    var artW = cols * b, artH = rows * b;
    return {
      paperW: pw, paperH: ph, bead: b, cols: cols, rows: rows,
      artW: artW, artH: artH, ox: (pw - artW) / 2, oy: (ph - artH) / 2
    };
  }

  function fmt(n, d) { return n.toFixed(d == null ? 1 : d); }
  function comma(n) { return n.toString().replace(/\B(?=(\d{3})+(?!\d))/g, ','); }

  function updateCalc() {
    var d = dims();
    var total = d.cols * d.rows;
    var bags = Math.ceil(total / Math.max(1, +$('perBag').value || 200));
    $('calcInfo').textContent =
      '図案の実寸: ' + fmt(d.artW) + ' × ' + fmt(d.artH) + ' mm\n' +
      'マス数: ' + d.cols + ' × ' + d.rows + ' = ' + comma(total) + ' 粒\n' +
      '用紙: ' + fmt(d.paperW, 0) + ' × ' + fmt(d.paperH, 0) + ' mm' +
      '（実際の余白 左右 ' + fmt(d.ox) + ' / 上下 ' + fmt(d.oy) + ' mm）\n' +
      'ビーズ間隔 ' + d.bead + ' mm ／ 総粒数の目安 約 ' + bags + ' 袋分';
    var head = (S.idx ? comma(S.cols * S.rows) + '粒 / ' + S.palette.length + '色 ／ ' : '') +
      fmt(d.artW) + '×' + fmt(d.artH) + 'mm（' + d.cols + '×' + d.rows + 'マス, ' + d.bead + 'mm）';
    $('dimInfo').textContent = head;
  }

  /* ================= 画像読み込み ================= */

  function loadImageFile(file) {
    if (!file || !/^image\//.test(file.type)) { status('画像ファイルを選んでください'); return; }
    var fr = new FileReader();
    fr.onload = function () { setImage(fr.result, true); };
    fr.readAsDataURL(file);
  }

  function setImage(dataUrl, autoGen, quiet) {
    var img = new Image();
    img.onload = function () {
      S.img = img; S.srcUrl = dataUrl;
      var t = $('thumb'); t.src = dataUrl; t.hidden = false;
      if (!quiet) status('画像を読み込みました（' + img.naturalWidth + '×' + img.naturalHeight + 'px）');
      if (autoGen) generate();

    img.onerror = function () { status('画像を読み込めませんでした'); };
    img.src = dataUrl;
  }

  /* ================= 図案生成 ================= */

  function generate() {
    if (!S.img) { status('先に画像を選んでください'); return; }
    status('図案を計算しています…');
    setTimeout(generateNow, 20);
  }

  function generateNow() {
    var d = dims();
    S.cols = d.cols; S.rows = d.rows; S.bead = d.bead;

    var rgb = Quantize.sampleGrid(S.img, d.cols, d.rows, {
      fit: $('fit').value,
      bg: $('bg').value,
      zoom: (+$('zoom').value || 100) / 100,
      offsetX: (+$('offX').value || 0) / 100,
      offsetY: (+$('offY').value || 0) / 100
    });
    Quantize.adjust(rgb, {
      brightness: +$('brightness').value,
      contrast: +$('contrast').value,
      saturation: +$('saturation').value,
      gamma: +$('gamma').value
    });

    var palette;
    if ($('stock').value === 'lock' && S.palette.length) {
      palette = S.palette.map(function (p) { return { code: p.code, name: p.name, hex: p.hex }; });
    } else {
      var k = Math.max(2, Math.min(60, +$('colors').value || 20));
      var clusters = Quantize.kmeans(Quantize.toLabArray(rgb), k, 16);
      palette = Quantize.snapToStock(clusters, DMC_COLORS);
    }

    var idx = Quantize.mapToPalette(rgb, d.cols, d.rows, palette, $('dither').checked);
    if ($('despeckle').checked) idx = Quantize.despeckle(idx, d.cols, d.rows).idx;

    /* 使われなかった色を捨てて、多い順に並べ替える */
    var counts = new Array(palette.length).fill(0);
    for (var i = 0; i < idx.length; i++) counts[idx[i]]++;
    var order = palette.map(function (p, i) { return { p: p, c: counts[i], i: i }; })
      .filter(function (o) { return o.c > 0; })
      .sort(function (a, b) { return b.c - a.c; });
    var remap = new Int16Array(palette.length);
    order.forEach(function (o, n) { remap[o.i] = n; });
    for (var j = 0; j < idx.length; j++) idx[j] = remap[idx[j]];

    S.palette = order.map(function (o) {
      return { code: o.p.code, name: o.p.name || '', hex: o.p.hex };
    });
    assignSymbols();
    S.idx = idx;
    S.sel = 0;
    S.edited = false;
    S.undo = [];
    recount();
    renderPalette();
    draw();
    updateCalc();
    status('図案を作成しました（' + S.palette.length + '色 / ' + comma(idx.length) + '粒）');
    autosave();
    if (!S.everGenerated && isNarrow()) showPanel('preview');

    S.everGenerated = true;
  }

  function assignSymbols() {
    S.palette.forEach(function (p, i) { p.symbol = SYMBOLS[i % SYMBOLS.length]; });
  }

  function recount() {
    S.counts = new Array(S.palette.length).fill(0);

  }

  function viewMode() { return $('viewMode').querySelector('.on').dataset.v; }
  function tool() { return $('tool').querySelector('.on').dataset.t; }

  function draw() {
    var cv = $('canvas');
    if (!S.idx) { cv.hidden = true; $('placeholder').hidden = false; return; }
    cv.hidden = false; $('placeholder').hidden = true;

    var cell = +$('viewZoom').value;
    var dpr = Math.min(2, window.devicePixelRatio || 1);
    var maxPx = 6000;
    while (Math.max(S.cols, S.rows) * cell * dpr > maxPx && dpr > 1) dpr -= 0.25;
    while (Math.max(S.cols, S.rows) * cell > maxPx && cell > 3) cell--;
    S.cellPx = cell;
    cv.width = S.cols * cell * dpr;
    cv.height = S.rows * cell * dpr;
    cv.style.width = (S.cols * cell) + 'px';
    cv.style.height = (S.rows * cell) + 'px';
    var ctx = cv.getContext('2d');
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    Render.drawGrid(ctx, {
      cols: S.cols, rows: S.rows, idx: S.idx, palette: S.palette,
      cell: cell, mode: viewMode(), shape: $('shape').value,
      showGrid: $('showGrid').checked, gridEvery: 10
    });
  }

  /* 図案全体が画面に収まる表示倍率にする */
  function fitZoom(silent) {
    if (!S.cols) return;
    var wrap = $('canvasWrap');
    var w = wrap.clientWidth - 34, h = wrap.clientHeight - 34;
    if (w < 40 || h < 40) return;
    var c = Math.floor(Math.min(w / S.cols, h / S.rows));
    c = Math.max(3, Math.min(28, c));
    $('viewZoom').value = c;

    if (!silent) status('全体が見える倍率にしました（1マス ' + c + 'px）');
  }

  function canvasCell(ev) {

    var cell = S.cellPx || +$('viewZoom').value;
    var x = Math.floor((ev.clientX - r.left) / cell);
    var y = Math.floor((ev.clientY - r.top) / cell);

    return { x: x, y: y, i: y * S.cols + x };
  }

  function pickAt(c) {

  }

  function removeColor(i) {

  function renderDmcList(query) {

        return c.code.toUpperCase().indexOf(q) >= 0 || (c.name || '').toUpperCase().indexOf(q) >= 0;

    } else if (S.editingIndex >= 0) {

  }

  function applyModal() {
    var i = S.editingIndex;
    if (i < 0 || !S.palette[i]) { closeModal(); return; }
    var hex = Color.normalizeHex($('mHexText').value) || Color.normalizeHex($('mHex').value);
    var code = $('mCode').value.trim() || S.palette[i].code;
    var hit = findDmc(code);
    S.palette[i].code = code;
    S.palette[i].hex = hex || S.palette[i].hex;
    S.palette[i].name = hit && hit.hex === S.palette[i].hex ? hit.name : (hit ? hit.name : 'custom');
    closeModal(); renderPalette(); draw(); autosave();
    status('色 ' + code + ' を更新しました');
  }

  function closeModal() { $('modal').hidden = true; S.editingIndex = -1; }

  /* ================= CSV ================= */

  function exportCsv() {
    var lines = ['code,hex,name,symbol,count'];
    S.palette.forEach(function (p, i) {
      lines.push([p.code, p.hex, '"' + (p.name || '').replace(/"/g, '""') + '"',
                  p.symbol, S.counts[i] || 0].join(','));
    });
    saveFile(new Blob(['﻿' + lines.join('\r\n')], { type: 'text/csv' }),
      fileBase() + '_palette.csv');
  }

  function importCsv(text) {
    var rows = text.replace(/^﻿/, '').split(/\r?\n/).filter(function (l) { return l.trim(); });
    var out = [];
    rows.forEach(function (line, n) {
      var cells = line.split(',');
      if (n === 0 && /code/i.test(cells[0])) return;
      var code = (cells[0] || '').trim().replace(/^"|"$/g, '');
      if (!code) return;
      var hex = Color.normalizeHex((cells[1] || '').trim().replace(/^"|"$/g, ''));
      var hit = findDmc(code);
      if (!hex && hit) hex = hit.hex;
      if (!hex) return;
      out.push({ code: code, hex: hex, name: (cells[2] || (hit ? hit.name : '')).replace(/^"|"$/g, '').trim() });
    });
    if (out.length < 2) { status('CSVを読み取れませんでした（code,hex の2列以上が必要です）'); return; }
    S.palette = out;
    assignSymbols();
    if (S.idx && S.img) {
      $('stock').value = 'lock';
      generate();
    } else {
      recount(); renderPalette();
    }
    status('CSVから ' + out.length + '色を読み込みました');
  }

  /* ================= 書き出し ================= */

  function fileBase() {
    var t = ($('title').value || 'diamond-art').trim();
    return t.replace(/[\\/:*?"<>|]/g, '_').slice(0, 40) || 'diamond-art';
  }

  /* 保存処理。claude.ai の Artifact として開かれているときは
     downloads capability を、それ以外は通常のダウンロードを使う。 */
  var downloadsCap = null;
  function saver() {
    if (!downloadsCap) {
      downloadsCap = (window.claude && typeof window.claude.use === 'function')
        ? window.claude.use('downloads').catch(function () { return null; })
        : Promise.resolve(null);
    }
    return downloadsCap;
  }

  function saveFile(blob, name) {
    return saver().then(function (dl) {
      if (dl) {
        return dl.save({ filename: name, data: blob }).then(function () {
          status(name + ' を保存しました');
        }, function (err) {
          var code = err && err.code;
          status(code === 'declined' ? '保存をキャンセルしました'
               : code === 'too_large' ? 'ファイルが大きすぎて保存できません'
               : '保存できませんでした（' + (code || 'error') + '）');
        });
      }
      var url = URL.createObjectURL(blob);
      var a = document.createElement('a');
      a.href = url; a.download = name;
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(function () { URL.revokeObjectURL(url); }, 4000);
    });
  }

  function exportPng() {
    if (!S.idx) { status('先に図案を作ってください'); return; }
    var cv = Render.toCanvas({
      cols: S.cols, rows: S.rows, idx: S.idx, palette: S.palette,
      cell: 14, mode: viewMode(), shape: $('shape').value,
      showGrid: $('showGrid').checked, gridEvery: 10
    });
    cv.toBlob(function (b) { saveFile(b, fileBase() + '.png'); }, 'image/png');
  }

  /* 日本語などを含む文字列を画像化して PDF に貼るためのヘルパー */
  function textImage(text, pxHeight) {
    var pad = 6, fontPx = pxHeight;
    var cv = document.createElement('canvas');
    var ctx = cv.getContext('2d');
    ctx.font = '600 ' + fontPx + 'px "Hiragino Sans","Noto Sans JP","Yu Gothic UI",sans-serif';
    var w = Math.ceil(ctx.measureText(text).width) + pad * 2;
    cv.width = Math.max(2, w); cv.height = Math.ceil(fontPx * 1.5);
    ctx = cv.getContext('2d');
    ctx.fillStyle = '#FFFFFF'; ctx.fillRect(0, 0, cv.width, cv.height);
    ctx.font = '600 ' + fontPx + 'px "Hiragino Sans","Noto Sans JP","Yu Gothic UI",sans-serif';
    ctx.fillStyle = '#111111'; ctx.textBaseline = 'middle';
    ctx.fillText(text, pad, cv.height / 2);
    return { url: cv.toDataURL('image/jpeg', 0.92), ratio: cv.width / cv.height };
  }

  function exportPdf() {
    if (!S.idx) { status('先に図案を作ってください'); return; }
    status('PDFを生成しています…');
    setTimeout(function () {
      try { buildPdf(); status('PDFを書き出しました'); }
      catch (e) { console.error(e); status('PDF生成でエラー: ' + e.message); }
    }, 30);
  }

  function buildPdf() {
    var d = dims();
    var doc = new MiniPDF.Doc();
    var title = ($('title').value || '').trim();
    var round = $('shape').value === 'round';
    var perBag = Math.max(1, +$('perBag').value || 200);

    /* ---- 1) 実寸チャート ---- */
    if ($('pdfActual').checked) {
      var pg = doc.addPage(d.paperW, d.paperH);
      pg.rect(0, 0, d.paperW, d.paperH, '#FFFFFF');
      var fill = $('pdfActualFill').checked;
      var syms = $('pdfActualSym').checked;
      var b = d.bead;
      var symSize = b * MiniPDF.MM * 0.60;

      if (fill) {
        for (var y = 0; y < S.rows; y++) {
          for (var x = 0; x < S.cols; x++) {
            var p = S.palette[S.idx[y * S.cols + x]];
            if (!p) continue;
            var cx = d.ox + x * b, cy = d.oy + y * b;
            var t = Color.tint(p.hex, 0.55);
            if (round) pg.circle(cx + b / 2, cy + b / 2, b * 0.46, t);
            else pg.rect(cx, cy, b, b, t);
          }
        }
      }
      /* 罫線 */
      for (var gx = 0; gx <= S.cols; gx++) {
        var major = gx % 10 === 0 || gx === S.cols;
        pg.line(d.ox + gx * b, d.oy, d.ox + gx * b, d.oy + d.artH,
          major ? '#8A939C' : '#D3D8DD', major ? 0.12 : 0.05);
      }
      for (var gy = 0; gy <= S.rows; gy++) {
        var majorY = gy % 10 === 0 || gy === S.rows;
        pg.line(d.ox, d.oy + gy * b, d.ox + d.artW, d.oy + gy * b,
          majorY ? '#8A939C' : '#D3D8DD', majorY ? 0.12 : 0.05);
      }
      if (syms) {
        for (var sy = 0; sy < S.rows; sy++) {
          for (var sx = 0; sx < S.cols; sx++) {
            var q = S.palette[S.idx[sy * S.cols + sx]];
            if (!q) continue;
            pg.glyph(q.symbol, d.ox + sx * b + b / 2, d.oy + sy * b + b / 2, symSize, '#232A31');
          }
        }
      }
      pg.rect(d.ox, d.oy, d.artW, d.artH, null, '#3A424A', 0.25);
      /* トンボ（余白がある場合のみ） */
      if (d.ox > 2.5 && d.oy > 2.5) {
        [[d.ox, d.oy], [d.ox + d.artW, d.oy], [d.ox, d.oy + d.artH], [d.ox + d.artW, d.oy + d.artH]]
          .forEach(function (c) {
            pg.line(c[0] - 2, c[1], c[0] - 0.6, c[1], '#000000', 0.12);
            pg.line(c[0] + 0.6, c[1], c[0] + 2, c[1], '#000000', 0.12);
            pg.line(c[0], c[1] - 2, c[0], c[1] - 0.6, '#000000', 0.12);
            pg.line(c[0], c[1] + 0.6, c[0], c[1] + 2, '#000000', 0.12);
          });
      }
      if (d.oy >= 3.2) {
        pg.text(fmt(d.artW) + ' x ' + fmt(d.artH) + ' mm  /  ' + S.cols + ' x ' + S.rows +
          ' = ' + comma(S.cols * S.rows) + ' beads  /  ' + d.bead + ' mm ' +
          (round ? 'round' : 'square') + '  /  print at 100%',
          d.paperW / 2, d.paperH - 1.2, 4.2, { align: 'center', color: '#8A939C' });
      }
    }

    /* ---- 2) 拡大チャート（A4） ---- */
    if ($('pdfBig').checked) {
      var cell = Math.max(3, +$('bigCell').value || 6);
      var PW = 210, PH = 297, M = 12, gut = 7, headH = 12;
      var capC = Math.max(1, Math.floor((PW - 2 * M - gut) / cell));
      var capR = Math.max(1, Math.floor((PH - 2 * M - gut - headH) / cell));
      var tx = Math.ceil(S.cols / capC), ty = Math.ceil(S.rows / capR);
      /* 端に細長いページが出ないよう、タイルを均等に割る */
      var cpp = Math.ceil(S.cols / tx), rpp = Math.ceil(S.rows / ty);
      var tImg = title ? textImage(title, 40) : null;
      var page = 0;
      for (var ti = 0; ti < ty; ti++) {
        for (var tj = 0; tj < tx; tj++) {
          page++;
          var c0 = tj * cpp, c1 = Math.min(S.cols, c0 + cpp);
          var r0 = ti * rpp, r1 = Math.min(S.rows, r0 + rpp);
          var bp = doc.addPage(PW, PH);
          bp.rect(0, 0, PW, PH, '#FFFFFF');
          if (tImg) bp.image(tImg.url, M, M - 6, 5 * tImg.ratio, 5);
          bp.text('Enlarged chart  ' + page + ' / ' + (tx * ty) +
            '   columns ' + (c0 + 1) + '-' + c1 + ' , rows ' + (r0 + 1) + '-' + r1 +
            '   (1 cell = ' + cell + ' mm on this sheet, actual bead ' + d.bead + ' mm)',
            M, M + 2, 8, { bold: true, color: '#232A31' });

          var gx0 = M + gut, gy0 = M + headH;
          var nc = c1 - c0, nr = r1 - r0;
          for (var yy = 0; yy < nr; yy++) {
            for (var xx = 0; xx < nc; xx++) {
              var pp = S.palette[S.idx[(r0 + yy) * S.cols + (c0 + xx)]];
              if (!pp) continue;
              var px = gx0 + xx * cell, py = gy0 + yy * cell;
              bp.rect(px, py, cell, cell, Color.tint(pp.hex, 0.5));
              bp.glyph(pp.symbol, px + cell / 2, py + cell / 2, cell * MiniPDF.MM * 0.5, '#1A1F25');
            }
          }
          for (var lx = 0; lx <= nc; lx++) {
            var mj = (c0 + lx) % 10 === 0 || lx === nc;
            bp.line(gx0 + lx * cell, gy0, gx0 + lx * cell, gy0 + nr * cell,
              mj ? '#39424C' : '#AEB6BE', mj ? 0.3 : 0.1);
            if ((c0 + lx) % 5 === 0 && lx < nc) {
              bp.text(String(c0 + lx + 1), gx0 + lx * cell + cell / 2, gy0 - 1.2, 5,
                { align: 'center', color: '#6B7580' });
            }
          }
          for (var ly = 0; ly <= nr; ly++) {
            var mjy = (r0 + ly) % 10 === 0 || ly === nr;
            bp.line(gx0, gy0 + ly * cell, gx0 + nc * cell, gy0 + ly * cell,
              mjy ? '#39424C' : '#AEB6BE', mjy ? 0.3 : 0.1);
            if ((r0 + ly) % 5 === 0 && ly < nr) {
              bp.text(String(r0 + ly + 1), gx0 - 1.2, gy0 + ly * cell + cell / 2 + 1.4, 5,
                { align: 'right', color: '#6B7580' });
            }
          }
        }
      }
    }

    /* ---- 3) 色一覧 ---- */
    if ($('pdfLegend').checked) {
      var LW = 210, LH = 297, LM = 14;
      var rowsPerCol = 40, rowH = 5.4;
      var order = S.palette.map(function (p, i) { return { p: p, c: S.counts[i] || 0 }; })
        .sort(function (a, b) { return b.c - a.c; });
      var total = S.cols * S.rows;

      var prev = Render.toCanvas({
        cols: S.cols, rows: S.rows, idx: S.idx, palette: S.palette,
        cell: 6, mode: 'color', shape: $('shape').value, showGrid: false
      });
      var prevUrl = prev.toDataURL('image/jpeg', 0.9);
      var tImg2 = title ? textImage(title, 44) : null;

      var lp = doc.addPage(LW, LH);
      lp.rect(0, 0, LW, LH, '#FFFFFF');
      var y0 = LM;
      if (tImg2) { lp.image(tImg2.url, LM, y0, 7 * tImg2.ratio, 7); y0 += 9; }
      lp.text('Diamond painting - color list', LM, y0 + 3, 11, { bold: true });
      y0 += 6;

      var pw2 = 52, ph2 = 52 * (S.rows / S.cols);
      if (ph2 > 62) { ph2 = 62; pw2 = 62 * (S.cols / S.rows); }
      lp.image(prevUrl, LM, y0 + 2, pw2, ph2);
      lp.rect(LM, y0 + 2, pw2, ph2, null, '#AEB6BE', 0.2);

      var ix = LM + pw2 + 8, iy = y0 + 7;
      [
        'Finished size : ' + fmt(d.artW) + ' x ' + fmt(d.artH) + ' mm',
        'Paper size    : ' + fmt(d.paperW, 0) + ' x ' + fmt(d.paperH, 0) + ' mm',
        'Grid          : ' + S.cols + ' x ' + S.rows + ' cells',
        'Bead          : ' + d.bead + ' mm ' + (round ? 'round' : 'square'),
        'Total beads   : ' + comma(total),
        'Colors        : ' + S.palette.length,
        'Beads per bag : ' + perBag
      ].forEach(function (line, n) {
        lp.text(line, ix, iy + n * 5.2, 8.4, { color: '#232A31' });
      });

      var startY = y0 + ph2 + 10;
      var colW = (LW - 2 * LM - 8) / 2;
      var cursor = { page: lp, x: LM, y: startY, col: 0, n: 0 };

      function header(pg2, x, y) {
        var c = '#6B7580';
        pg2.text('sym', x + 7.6, y, 7.2, { bold: true, color: c });
        pg2.text('code', x + 13, y, 7.2, { bold: true, color: c });
        pg2.text('beads', x + colW - 30, y, 7.2, { bold: true, color: c, align: 'right' });
        pg2.text('bags', x + colW - 12, y, 7.2, { bold: true, color: c, align: 'right' });
        pg2.text('hex', x + colW - 8, y, 7.2, { bold: true, color: c });
        pg2.line(x, y + 1.4, x + colW - 4, y + 1.4, '#AEB6BE', 0.15);
      }
      header(cursor.page, cursor.x, cursor.y);
      cursor.y += 4.6;

      order.forEach(function (o) {
        if (cursor.y + rowH > LH - LM) {
          if (cursor.col === 0) {
            cursor.col = 1;
            cursor.x = LM + colW + 8;
            cursor.y = startY;
          } else {
            cursor.page = doc.addPage(LW, LH);
            cursor.page.rect(0, 0, LW, LH, '#FFFFFF');
            cursor.col = 0; cursor.x = LM; cursor.y = LM + 4;
          }
          header(cursor.page, cursor.x, cursor.y);
          cursor.y += 4.6;
        }
        var pg3 = cursor.page, X = cursor.x, Y = cursor.y;
        pg3.rect(X, Y, 4.4, 4.4, o.p.hex, '#8A939C', 0.12);
        pg3.text(o.p.symbol, X + 7.6, Y + 3.4, 8, { bold: true });
        pg3.text(String(o.p.code), X + 13, Y + 3.4, 8);
        pg3.text(comma(o.c), X + colW - 30, Y + 3.4, 8, { align: 'right' });
        pg3.text(String(Math.ceil(o.c * 1.1 / perBag)), X + colW - 12, Y + 3.4, 8, { align: 'right' });
        pg3.text(o.p.hex, X + colW - 8, Y + 3.4, 6, { color: '#9AA3AC' });
        cursor.y += rowH;
      });

      cursor.page.text('bags = ceil(beads x 1.1 / ' + perBag + ')  incl. 10% spare',
        LM, LH - LM + 4, 6.6, { color: '#9AA3AC' });
    }

    saveFile(doc.build(), fileBase() + '.pdf');
  }

  /* ================= 保存・復元 ================= */

  function projectData(includeImage) {
    return {
      v: 1,
      title: $('title').value,
      settings: collectSettings(),
      cols: S.cols, rows: S.rows, bead: S.bead,
      palette: S.palette,
      idx: S.idx ? Array.from(S.idx) : null,
      src: includeImage ? S.srcUrl : null
    };
  }

  var SETTING_IDS = ['fit', 'zoom', 'offX', 'offY', 'bg', 'preset', 'paperW', 'paperH',
    'margin', 'shape', 'beadPreset', 'bead', 'colors', 'stock', 'dither', 'despeckle',
    'brightness', 'contrast', 'saturation', 'gamma', 'title', 'pdfActual', 'pdfActualFill',
    'pdfActualSym', 'pdfBig', 'bigCell', 'pdfLegend', 'perBag', 'showGrid', 'viewZoom'];

  function collectSettings() {
    var o = {};
    SETTING_IDS.forEach(function (id) {
      var el = $(id); if (!el) return;
      o[id] = el.type === 'checkbox' ? el.checked : el.value;
    });
    return o;
  }

  function applySettings(o) {
    if (!o) return;
    SETTING_IDS.forEach(function (id) {
      if (!(id in o)) return;
      var el = $(id); if (!el) return;
      if (el.type === 'checkbox') el.checked = !!o[id]; else el.value = o[id];
    });
    syncOutputs();
    $('beadCustomRow').hidden = $('beadPreset').value !== 'custom';
  }

  function saveProject() {
    saveFile(new Blob([JSON.stringify(projectData(true))], { type: 'application/json' }),
      fileBase() + '.json');
    status('プロジェクトを保存しました');
  }

  function loadProject(text) {
    var o;
    try { o = JSON.parse(text); } catch (e) { status('ファイルを読み込めませんでした'); return; }
    applySettings(o.settings);
    S.palette = o.palette || [];
    S.cols = o.cols; S.rows = o.rows; S.bead = o.bead || beadSize();
    S.idx = o.idx ? Int16Array.from(o.idx) : null;
    S.edited = true;
    assignSymbols(); recount(); renderPalette(); updateCalc();
    if (o.src) setImage(o.src, false, true);
    draw();
    status('プロジェクトを読み込みました（' + S.palette.length + '色 / ' +
      comma(S.cols * S.rows) + '粒）');
  }

  function autosave() {
    try {
      localStorage.setItem(STORE_KEY, JSON.stringify(projectData(true)));
    } catch (e) {
      try { localStorage.setItem(STORE_KEY, JSON.stringify(projectData(false))); }
      catch (e2) { /* 容量オーバーは黙って諦める */ }
    }
  }

  function restore() {
    var raw = null;
    try { raw = localStorage.getItem(STORE_KEY); } catch (e) { return false; }
    if (!raw) return false;
    try { loadProject(raw); return true; } catch (e) { return false; }
  }

  /* ================= イベント ================= */

  function status(msg) { $('status').textContent = msg; }

  function isNarrow() { return window.matchMedia('(max-width:1180px)').matches; }

  function showPanel(name) {
    document.querySelectorAll('.layout > .panel').forEach(function (p) {
      p.classList.toggle('active', p.dataset.panel === name);
    });
    $('tabbar').querySelectorAll('button').forEach(function (b) {
      b.classList.toggle('on', b.dataset.p === name);
    });
    if (name === 'preview') draw();
    window.scrollTo(0, 0);
  }

  function syncOutputs() {
    $('zoomOut').textContent = ((+$('zoom').value) / 100).toFixed(2) + '×';
    $('offXOut').textContent = $('offX').value;
    $('offYOut').textContent = $('offY').value;
    $('brightnessOut').textContent = $('brightness').value;
    $('contrastOut').textContent = $('contrast').value;
    $('saturationOut').textContent = $('saturation').value;
    $('gammaOut').textContent = $('gamma').value;
  }

  var regenTimer = null;
  function scheduleRegen() {
    updateCalc();
    if (!S.img) return;
    if (S.edited) { status('設定を変えました。手作業の修正を残したまま作り直す場合は「図案を作る」を押してください'); return; }
    clearTimeout(regenTimer);
    regenTimer = setTimeout(generate, 260);
  }

  function bind() {
    $('btnPick').addEventListener('click', function () { $('file').click(); });
    $('file').addEventListener('change', function (e) { loadImageFile(e.target.files[0]); });

    var drop = $('drop');
    ['dragenter', 'dragover'].forEach(function (t) {
      drop.addEventListener(t, function (e) { e.preventDefault(); drop.classList.add('over'); });
    });
    ['dragleave', 'drop'].forEach(function (t) {
      drop.addEventListener(t, function (e) { e.preventDefault(); drop.classList.remove('over'); });
    });
    drop.addEventListener('drop', function (e) {
      if (e.dataTransfer.files && e.dataTransfer.files[0]) loadImageFile(e.dataTransfer.files[0]);
    });

    $('preset').addEventListener('change', function () {
      var v = $('preset').value;
      if (v !== 'custom') {
        var m = v.split('x');
        $('paperW').value = m[0]; $('paperH').value = m[1];
      }
      scheduleRegen();
    });
    $('beadPreset').addEventListener('change', function () {
      $('beadCustomRow').hidden = $('beadPreset').value !== 'custom';
      if ($('beadPreset').value !== 'custom') $('bead').value = $('beadPreset').value;
      if ($('beadPreset').value === '2.8') $('shape').value = 'round';
      if ($('beadPreset').value === '2.5') $('shape').value = 'square';
      scheduleRegen();
    });

    ['paperW', 'paperH', 'margin', 'bead', 'colors', 'stock', 'fit', 'bg',
     'dither', 'despeckle', 'zoom', 'offX', 'offY',
     'brightness', 'contrast', 'saturation', 'gamma'].forEach(function (id) {
      $(id).addEventListener('input', function () { syncOutputs(); scheduleRegen(); });
      $(id).addEventListener('change', function () { syncOutputs(); scheduleRegen(); });
    });
    $('perBag').addEventListener('input', updateCalc);
    $('shape').addEventListener('change', function () { draw(); updateCalc(); });

    $('btnGenerate').addEventListener('click', generate);

    $('viewMode').addEventListener('click', function (e) {
      if (e.target.tagName !== 'BUTTON') return;
      this.querySelectorAll('button').forEach(function (b) { b.classList.remove('on'); });
      e.target.classList.add('on'); draw();
    });
    $('tool').addEventListener('click', function (e) {
      if (e.target.tagName !== 'BUTTON') return;
      this.querySelectorAll('button').forEach(function (b) { b.classList.remove('on'); });
      e.target.classList.add('on');
    });
    $('showGrid').addEventListener('change', draw);
    $('btnFit').addEventListener('click', function () { fitZoom(false); });
    $('viewZoom').addEventListener('input', draw);
    $('btnUndo').addEventListener('click', function () {
      if (!S.undo.length) { status('元に戻せる操作がありません'); return; }
      S.idx = S.undo.pop();
      recount(); renderPalette(); draw(); autosave();
      status('元に戻しました');
    });

    var cv = $('canvas');
    cv.addEventListener('pointerdown', onCanvasDown);
    cv.addEventListener('click', onCanvasClick);
    window.addEventListener('pointermove', onCanvasMove);
    window.addEventListener('pointerup', onCanvasUp);
    window.addEventListener('pointercancel', onCanvasUp);
    cv.addEventListener('contextmenu', function (e) { e.preventDefault(); });
    $('touchPaint').addEventListener('change', function () {
      cv.classList.toggle('touch-paint', this.checked);
      status(this.checked ? '指でなぞって塗るモードです（キャンバス上ではスクロールしません）'
                          : 'タップで1粒ずつ塗ります。キャンバス上を指で動かすとスクロールします');
    });

    $('tabbar').addEventListener('click', function (e) {
      if (e.target.tagName === 'BUTTON') showPanel(e.target.dataset.p);
    });

    $('btnAdd').addEventListener('click', addColor);
    $('btnCsvOut').addEventListener('click', exportCsv);
    $('btnCsvIn').addEventListener('click', function () { $('csvFile').click(); });
    $('csvFile').addEventListener('change', function (e) {
      var f = e.target.files[0]; if (!f) return;
      var fr = new FileReader();
      fr.onload = function () { importCsv(String(fr.result)); };
      fr.readAsText(f);
      e.target.value = '';
    });

    $('modalClose').addEventListener('click', closeModal);
    $('mApply').addEventListener('click', applyModal);
    $('modal').addEventListener('click', function (e) { if (e.target === this) closeModal(); });
    $('mHex').addEventListener('input', function () { $('mHexText').value = $('mHex').value.toUpperCase(); });
    $('mHexText').addEventListener('change', function () {
      var h = Color.normalizeHex($('mHexText').value);
      if (h) { $('mHex').value = h; $('mHexText').value = h; }
    });
    $('mCode').addEventListener('change', function () {
      var hit = findDmc($('mCode').value);
      if (hit) { $('mHex').value = hit.hex; $('mHexText').value = hit.hex; }
    });
    $('mSearch').addEventListener('input', function () { renderDmcList(this.value); });

    $('btnPng').addEventListener('click', exportPng);
    $('btnPdf').addEventListener('click', exportPdf);
    $('btnSave').addEventListener('click', saveProject);
    $('btnLoad').addEventListener('click', function () { $('projFile').click(); });
    $('projFile').addEventListener('change', function (e) {
      var f = e.target.files[0]; if (!f) return;
      var fr = new FileReader();
      fr.onload = function () { loadProject(String(fr.result)); };
      fr.readAsText(f);
      e.target.value = '';
    });

    document.addEventListener('keydown', function (e) {
      if (e.key === 'Escape' && !$('modal').hidden) closeModal();
      if ((e.ctrlKey || e.metaKey) && e.key === 'z' && S.undo.length) {
        e.preventDefault(); $('btnUndo').click();
      }
    });
    window.addEventListener('beforeunload', autosave);
  }

  if (navigator.maxTouchPoints > 0 || window.matchMedia('(hover:none)').matches) {
    document.body.classList.add('is-touch');
  }
  bind();
  syncOutputs();
  updateCalc();
  if (!restore()) status('画像を選んで「図案を作る」を押してください');
})();

</script>
